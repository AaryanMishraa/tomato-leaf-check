<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomato Leaf Check</title>
<meta name="description" content="Checks a tomato leaf photo for 7 problems on your phone, offline, and says what to do. Includes a game: can you beat the AI?">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121915" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leaf Check">
<!--
  Tomato Leaf Check, version 2 (27 Oct 2026). Group 23, B.Tech AI/ML, Universal AI University.
  This one file holds the whole interface: the styles, the screens and the game.
  It reuses the other files in this folder unchanged: js/model.js (on-phone AI), js/i18n.js (text),
  data/ (advice, results, photos), model/ (MobileNetV2), vendor/ (TensorFlow.js), fonts/, icons/, sw.js.
  css/app.css and js/app.js were used by version 1 and are no longer loaded.
-->
<style>
/* Devanagari for Hindi and Marathi, bundled so it works offline */
@font-face { font-family: 'Noto Sans Devanagari'; src: url(fonts/noto-sans-devanagari-devanagari-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }
@font-face { font-family: 'Noto Sans Devanagari'; src: url(fonts/noto-sans-devanagari-devanagari-700-normal.woff2) format('woff2'); font-weight: 600 700; font-display: swap; unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+25CC, U+A830-A839, U+A8E0-A8FF; }

:root {
  --canvas: #F2F4F3;
  --surface: #FFFFFF;
  --fill: #EEF1EF;          /* quiet fills: tracks, chips, photo backdrop */
  --line: #DFE4E1;
  --ink: #0E1A13;
  --ink-2: #57635C;
  --ink-3: #87918B;
  --leaf: #1D6B42;          /* brand */
  --leaf-press: #165536;
  --leaf-soft: #E2F0E7;
  --leaf-ink: #145232;
  --tomato: #C8372D;        /* act now / wrong */
  --tomato-soft: #FBE8E5;
  --amber: #9A5800;         /* not sure / medium */
  --amber-soft: #FBEFD9;
  --on-leaf: #FFFFFF;
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Noto Sans Devanagari', 'Helvetica Neue', Arial, sans-serif;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #0A0F0C; --surface: #121915; --fill: #1A231E; --line: #243029;
    --ink: #E8EEEA; --ink-2: #9EAAA3; --ink-3: #6E7A73;
    --leaf: #57C08A; --leaf-press: #45A876; --leaf-soft: #16301F; --leaf-ink: #8FDDB2;
    --tomato: #FF7A6C; --tomato-soft: #3A1A16; --amber: #F2B048; --amber-soft: #33260F;
    --on-leaf: #06130B;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* The page itself never scrolls or bounces. Only the middle area scrolls, so the
   top bar and the tab bar stay put on iPhone and Android. */
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--canvas); }
body { font: 400 16px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
html[lang="hi"] body, html[lang="mr"] body { line-height: 1.65; }
button, input, label { font: inherit; color: inherit; }
button { cursor: pointer; }
img, canvas, svg { display: block; max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--canvas); overflow: hidden; }
.topbar {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: #1D6B42; display: grid; place-items: center; flex: none; }
.logo svg { width: 22px; height: 22px; }
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lang { display: flex; background: var(--fill); border-radius: 999px; padding: 3px; flex: none; }
.lang button { border: 0; background: none; border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 38px; }
.lang button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.scroller { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
.view { max-width: 560px; margin: 0 auto; padding: 16px 16px 32px; }

.tabbar {
  flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line);
}
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0 2px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; line-height: 1.2; }
.tabbar .pill { width: 56px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background-color .2s ease; }
.tabbar svg { width: 22px; height: 22px; }
.tabbar button[aria-selected="true"] { color: var(--leaf-ink); }
.tabbar button[aria-selected="true"] .pill { background: var(--leaf-soft); color: var(--leaf); }

/* ---------- type ---------- */
.t-large { font-size: 28px; line-height: 1.18; font-weight: 700; letter-spacing: -.022em; margin: 0 0 8px; }
.t-title { font-size: 22px; line-height: 1.25; font-weight: 700; letter-spacing: -.015em; margin: 0; }
.t-head { font-size: 17px; line-height: 1.35; font-weight: 600; margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.label { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 24px 4px 8px; }
p { margin: 0 0 10px; }
ul { margin: 0; padding-left: 20px; }
li { margin: 6px 0; }
a { color: var(--leaf); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
.row + .row { border-top: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .val { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.row .val.bad { color: var(--tomato); }
.row.metric { flex-direction: column; align-items: stretch; gap: 2px; }
.row.metric .grow { font-size: 14px; color: var(--ink-2); }
.row.metric .val { text-align: left; font-size: 17px; }
.ico-box { width: 34px; height: 34px; border-radius: 10px; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; flex: none; }
.ico-box svg { width: 19px; height: 19px; }

/* ---------- buttons and chips ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 12px 18px; width: 100%;
  border-radius: var(--r-md); border: 1px solid transparent; font-size: 16px; font-weight: 600; text-align: center; text-decoration: none;
  transition: transform .08s ease, background-color .15s ease;
}
.btn:active { transform: scale(.985); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primary { background: var(--leaf); color: var(--on-leaf); }
.btn-primary:active { background: var(--leaf-press); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-tonal { background: var(--leaf-soft); color: var(--leaf-ink); }
.btn[disabled] { opacity: .5; }
.btn-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.btn-col { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--fill); color: var(--ink-2); }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.chip.ok { background: var(--leaf-soft); color: var(--leaf-ink); }
.chip.warn { background: var(--amber-soft); color: var(--amber); }
.chip.bad { background: var(--tomato-soft); color: var(--tomato); }
.chip.wait i { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- home ---------- */
.hero { padding: 22px 18px 18px; }
.hero .badge { width: 52px; height: 52px; border-radius: 16px; background: var(--leaf-soft); color: var(--leaf); display: grid; place-items: center; margin-bottom: 14px; }
.hero .badge svg { width: 30px; height: 30px; }
.hero .lead { color: var(--ink-2); margin: 0 0 18px; max-width: 34em; }
.status-chips { margin: 14px 2px 0; }
.samples { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sample { border: 0; background: none; padding: 0; text-align: left; align-self: start; display: flex; flex-direction: column; }
.sample img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; background: var(--fill); }
.sample span { display: block; font-size: 12px; line-height: 1.3; color: var(--ink-2); margin-top: 6px; overflow-wrap: anywhere; }
.sample:active img { opacity: .8; }

/* ---------- photo with heatmap ---------- */
.photo { position: relative; background: var(--fill); border-radius: var(--r-lg); overflow: hidden; }
.photo .stack { position: relative; margin: 0 auto; }
.photo canvas { width: 100%; height: auto; }
.photo canvas.heat { position: absolute; inset: 0; opacity: 0; transition: opacity .3s ease; }
.photo.show-heat canvas.heat { opacity: .5; }
.photo .toggle {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; padding: 3px; border-radius: 999px;
  background: rgba(10, 15, 12, .62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.photo .toggle button { border: 0; background: none; color: rgba(255,255,255,.85); font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
.photo .toggle button[aria-pressed="true"] { background: #fff; color: #0E1A13; }
.heat-note { font-size: 13px; color: var(--ink-2); margin: 10px 4px 0; }

/* ---------- result ---------- */
.subbar {
  position: sticky; top: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: -16px -16px 12px; padding: 8px 8px; background: var(--canvas); background: color-mix(in srgb, var(--canvas) 88%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.link-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--leaf); font-size: 16px; font-weight: 600; padding: 8px; border-radius: 10px; }
.link-btn svg { width: 20px; height: 20px; }
.diag { margin-top: 12px; }
.diag-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
.diag-sub { color: var(--ink-2); margin: 6px 0 0; }
.diag .chips { margin-top: 14px; }
.meter { margin-top: 18px; }
.meter-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.meter-head b { font-size: 20px; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.meter-track { position: relative; height: 10px; border-radius: 999px; background: var(--fill); margin-top: 8px; }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: var(--leaf); transition: width .7s cubic-bezier(.2,.7,.2,1); }
.meter-fill.high { background: var(--tomato); }
.meter-fill.unsure { background: var(--amber); }
.meter-tick { position: absolute; top: -5px; bottom: -5px; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--ink); }
.meter-note { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }

details.acc + details.acc { border-top: 1px solid var(--line); }
details.acc > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-weight: 600; cursor: pointer; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary .grow { flex: 1; }
details.acc > summary .chev { width: 18px; height: 18px; color: var(--ink-3); transition: transform .2s ease; flex: none; }
details.acc[open] > summary .chev { transform: rotate(180deg); }
details.acc .acc-body { padding: 0 16px 16px; }
.warn-box { background: var(--amber-soft); color: var(--ink); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; }
table.spray { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.spray th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
table.spray td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.spray tr:last-child td { border-bottom: 0; }
.sources { font-size: 12.5px; color: var(--ink-3); margin: 10px 4px 0; }
.sources a { color: var(--ink-2); }
.bars .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 11px 16px; font-size: 15px; }
.bars .bar-row + .bar-row { border-top: 1px solid var(--line); }
.bars .bar-row .track { grid-column: 1 / -1; height: 6px; background: var(--fill); border-radius: 999px; overflow: hidden; }
.bars .bar-row .track i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; }
.bars .bar-row.top { font-weight: 600; }
.foot { font-size: 12.5px; line-height: 1.5; color: var(--ink-3); margin: 18px 4px 0; }
.busy { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 64px 0; color: var(--ink-2); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--leaf-soft); border-top-color: var(--leaf); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { background: var(--tomato-soft); color: var(--tomato); padding: 14px 16px; border-radius: var(--r-md); margin: 12px 0; font-weight: 600; }

/* ---------- game ---------- */
.score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 18px; }
.score .side { display: flex; flex-direction: column; }
.score .side.ai { align-items: flex-end; }
.score .who { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.score .n { font-size: 34px; line-height: 1.05; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.score .side.you .n { color: var(--leaf); }
.score .side.ai .n { color: var(--tomato); }
.score .vs { font-size: 13px; font-weight: 600; color: var(--ink-3); }
.bump { animation: bump .45s ease; display: inline-block; }
@keyframes bump { 40% { transform: scale(1.3); } }
.progress { display: flex; gap: 4px; margin: 14px 0 0; }
.progress i { flex: 1; height: 5px; border-radius: 999px; background: var(--fill); }
.progress i.done.lab { background: var(--leaf); }
.progress i.done.field { background: var(--amber); }
.progress i.now { background: var(--ink); }
.stage-row { display: flex; justify-content: space-between; align-items: center; margin: 16px 2px 10px; }
.stage-row .t-head { font-size: 15px; }
.options { display: grid; gap: 8px; margin-top: 4px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.opt .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-3); flex: none; display: grid; place-items: center; }
.opt .txt { display: flex; flex-direction: column; min-width: 0; }
.opt .txt b { font-weight: 600; font-size: 15.5px; }
.opt .txt small { font-size: 13px; color: var(--ink-2); line-height: 1.35; margin-top: 1px; }
.opt.chosen { border-color: var(--leaf); background: var(--leaf-soft); }
.opt.chosen .radio { border-color: var(--leaf); }
.opt.chosen .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--leaf); }
.opt[disabled] { cursor: default; }
.opt[disabled]:not(.chosen) { opacity: .55; }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-weight: 600; padding: 4px 2px 12px; }
.reveal { margin-top: 12px; }
.verdict { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; }
.verdict svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }
.verdict .ok { color: var(--leaf); }
.verdict .no { color: var(--tomato); }
.verdict .note { display: block; font-size: 13px; color: var(--ink-2); }
.tell { background: var(--fill); border-radius: var(--r-sm); padding: 11px 13px; font-size: 14.5px; margin: 14px 0 16px; }
.intro-stage { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; }
.intro-stage + .intro-stage { border-top: 1px solid var(--line); }
.intro-stage .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; flex: none; }
.intro-stage .n.lab { background: var(--leaf-soft); color: var(--leaf-ink); }
.intro-stage .n.field { background: var(--amber-soft); color: var(--amber); }
.final { text-align: center; padding: 24px 18px; }
.final .big { font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -.03em; margin: 12px 0 6px; font-variant-numeric: tabular-nums; }
.final .big .y { color: var(--leaf); }
.final .big .a { color: var(--tomato); }
.final .big .sep { color: var(--ink-3); font-weight: 400; margin: 0 14px; }
.final .who-row { display: flex; justify-content: center; gap: 46px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.lessons li { margin: 10px 0; }

/* ---------- about ---------- */
.steps { list-style: none; padding: 0; margin: 0; }
.steps li { display: flex; gap: 12px; padding: 12px 16px; margin: 0; }
.steps li + li { border-top: 1px solid var(--line); }
.steps .n { width: 26px; height: 26px; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf-ink); font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none; margin-top: 1px; }
.qr-card { display: flex; gap: 16px; align-items: center; }
.qr { width: 112px; height: 112px; padding: 8px; background: #fff; border-radius: 12px; flex: none; border: 1px solid var(--line); }
.qr svg { width: 100%; height: 100%; }
.qr-link { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; margin: 6px 0 12px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: var(--canvas); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- laptop and desktop: show the phone app in a phone frame ---------- */
.desk { display: none; }
@media (min-width: 920px) and (min-height: 620px) {
  html, body { background: #E9EDEA; }
  .desk {
    display: flex; flex-direction: column; justify-content: center; position: fixed; top: 0; bottom: 0;
    left: max(32px, calc(50% - 520px)); width: 400px; color: #0E1A13;
  }
  .desk .logo { width: 48px; height: 48px; border-radius: 13px; margin-bottom: 18px; }
  .desk .logo svg { width: 32px; height: 32px; }
  .desk h1 { font-size: 34px; line-height: 1.15; letter-spacing: -.025em; margin: 0 0 12px; }
  .desk p { color: #4C5852; font-size: 16.5px; line-height: 1.55; max-width: 26em; }
  .desk .qr { width: 168px; height: 168px; margin: 22px 0 10px; border-color: #D5DCD8; }
  .desk .qr-link { color: #4C5852; font-size: 14px; }
  .desk .note { margin-top: 18px; padding-top: 16px; border-top: 1px solid #D5DCD8; font-size: 14px; color: #4C5852; }
  .app {
    inset: auto; top: 50%; left: calc(max(32px, calc(50% - 520px)) + 480px); width: 390px; height: min(844px, calc(100vh - 48px));
    transform: translateY(-50%); border-radius: 46px; border: 11px solid #101512; box-shadow: 0 30px 70px -20px rgba(16, 24, 19, .45);
  }
  .toast { left: calc(max(32px, calc(50% - 520px)) + 675px); bottom: 80px; }
}
@media (min-width: 920px) and (min-height: 620px) and (prefers-color-scheme: dark) {
  html, body { background: #070A08; }
  .desk { color: #E8EEEA; }
  .desk p, .desk .qr-link, .desk .note { color: #9EAAA3; }
  .desk .note { border-color: #243029; }
  .app { border-color: #2A332E; }
}
@media (max-width: 360px) {
  .samples { grid-template-columns: repeat(3, 1fr); }
  .btn-row { grid-template-columns: 1fr; }
  .brand-name { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<aside class="desk" aria-label="Open on your phone">
  <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 25C9 15 15 9 26 6c-1 10-7 17-18 19" fill="#fff"/><path d="M7.5 23.5 21 10" stroke="#1D6B42" stroke-width="1.7" stroke-linecap="round"/><circle cx="24.5" cy="24" r="3.6" fill="#E0473B"/></svg></div>
  <h1 data-i18n="desk_title">This is a phone app</h1>
  <p data-i18n="desk_body"></p>
  <div class="qr" id="desk-qr"></div>
  <div class="qr-link" id="desk-link"></div>
  <p class="note" data-i18n="desk_note"></p>
</aside>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 25C9 15 15 9 26 6c-1 10-7 17-18 19" fill="#fff"/><path d="M7.5 23.5 21 10" stroke="#1D6B42" stroke-width="1.7" stroke-linecap="round"/><circle cx="24.5" cy="24" r="3.6" fill="#E0473B"/></svg></div>
      <span class="brand-name" data-i18n="app_name">Tomato Leaf Check</span>
    </div>
    <div class="lang" id="lang" role="group" aria-label="Language"></div>
  </header>

  <main class="scroller" id="scroller">
    <section class="view" id="view-check" aria-labelledby="tab-check">
      <div id="check-start"></div>
      <div id="check-result" hidden></div>
    </section>
    <section class="view" id="view-game" aria-labelledby="tab-game" hidden></section>
    <section class="view" id="view-about" aria-labelledby="tab-about" hidden></section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-check" aria-controls="view-check" aria-selected="true" data-view="check">
      <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20C7 11 12 6 20 4c-.5 8-5 14-14 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M6 19 16 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
      <span data-i18n="tab_check">Check a leaf</span>
    </button>
    <button role="tab" id="tab-game" aria-controls="view-game" aria-selected="false" data-view="game">
      <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v3a5 5 0 0 1-10 0z M12 12v4 M8 20h8 M9 16h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M7 5H4c0 3 1.5 4.5 3.5 4.8 M17 5h3c0 3-1.5 4.5-3.5 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
      <span data-i18n="tab_game">Beat the AI</span>
    </button>
    <button role="tab" id="tab-about" aria-controls="view-about" aria-selected="false" data-view="about">
      <span class="pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 11v6 M12 7.5v.5" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg></span>
      <span data-i18n="tab_about">How it works</span>
    </button>
  </nav>
</div>

<input type="file" id="in-camera" accept="image/*" capture="environment" class="sr-only" tabindex="-1" aria-hidden="true">
<input type="file" id="in-gallery" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

// ---------- photos ----------
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('image'));
    img.src = src;
  });
}

// A photo with the heatmap layer and a Photo / Heatmap switch on top.
function makePhoto(img, vh, { toggle = true, heatOn = false } = {}) {
  const wrap = document.createElement('div'); wrap.className = 'photo';
  const w = img.naturalWidth, h = img.naturalHeight, ar = w / h;
  const dw = Math.min(900, Math.max(w, 448)), dh = Math.round(dw / ar);
  const stack = document.createElement('div'); stack.className = 'stack';
  stack.style.width = `min(100%, calc(${vh}vh * ${ar.toFixed(4)}))`;
  const base = document.createElement('canvas'); base.width = dw; base.height = dh;
  const ctx = base.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, dw, dh);
  const heat = document.createElement('canvas'); heat.className = 'heat';
  heat.width = 280; heat.height = Math.max(1, Math.round(280 / ar)); heat.setAttribute('aria-hidden', 'true');
  stack.append(base, heat); wrap.append(stack);
  let sw = null;
  if (toggle) {
    sw = document.createElement('div'); sw.className = 'toggle'; sw.setAttribute('role', 'group');
    sw.innerHTML = `<button type="button" data-heat="0">${esc(t('view_photo'))}</button><button type="button" data-heat="1">${esc(t('view_heat'))}</button>`;
    wrap.append(sw);
  }
  const api = {
    el: wrap,
    setCam(cam) { paintHeat(heat, cam); },
    showHeat(on) {
      wrap.classList.toggle('show-heat', on);
      if (sw) sw.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.heat === '1') === on)));
    }
  };
  api.showHeat(heatOn);
  return api;
}

function adviceGroup(cls, { openFirst = true } = {}) {
  const c = cards[cls], m = cards._meta;
  const list = arr => `<ul>${loc(arr).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const sec = (name, body, open) => `<details class="acc" ${open ? 'open' : ''}><summary><span class="grow">${esc(name)}</span>${I.chev}</summary><div class="acc-body">${body}</div></details>`;
  let html = `<div class="group">`;
  html += sec(t('sec_now'), list(c.act_now), openFirst);
  if (c.sprays.length) {
    const rows = c.sprays.map(s => `<tr><td>${esc(s.product)}</td><td>${esc(loc(s.dose))}</td></tr>`).join('');
    html += sec(t('sec_sprays'), `<div class="warn-box">${esc(loc(m.spray_warning))}</div><table class="spray"><thead><tr><th>${esc(t('product'))}</th><th>${esc(t('dose'))}</th></tr></thead><tbody>${rows}</tbody></table>`, false);
  }
  html += sec(t('sec_prevent'), list(c.prevent), false);
  html += sec(t('sec_signs'), list(c.signs), false);
  html += sec(t('sec_expert'), `<p>${esc(loc(c.expert))}</p>`, false);
  html += `</div>`;
  const links = c.sources.map(k => `<a href="${m.sources[k].url}" target="_blank" rel="noopener">${esc(m.sources[k].title)}</a>`).join('; ');
  return html + `<p class="sources">${esc(t('advice_from'))}: ${links}</p>`;
}

    <div class="meter-track" role="img" aria-label="${esc(t('confidence'))} ${pct(conf)}%">
      <div class="meter-fill ${kind}" data-w="${(conf * 100).toFixed(1)}"></div>
      <div class="meter-tick" style="left:${th}%"></div>
    </div>
    <div class="meter-note">${esc(t('conf_note', { t: th }))}</div>
  </div>`;
}

    <div class="group">${loc(u.retake_tips).map(x => `<div class="row"><span class="grow">${esc(x)}</span></div>`).join('')}</div>
    <p class="sources">${esc(loc(u.expert))}</p>`;
    for (const k of [a, b]) html += `<h2 class="label">${esc(t('if_it_is', { x: title(meta.classes[k]) }))}</h2>${adviceGroup(meta.classes[k], { openFirst: false })}`;
  }
  html += `<h2 class="label">${esc(t('all_matches'))}</h2>
    <div class="group bars">${res.order.map((i, k) => `
      <div class="bar-row ${k === 0 ? 'top' : ''}"><span>${esc(title(meta.classes[i]))}</span><span class="num">${(res.probs[i] * 100).toFixed(1)}%</span>
      <div class="track"><i style="width:${(res.probs[i] * 100).toFixed(1)}%"></i></div></div>`).join('')}</div>
    <div style="margin-top:20px"><button class="btn btn-secondary" type="button" data-act="again">${esc(t('check_another'))}</button></div>
    <p class="foot">${esc(t('worked_out', { s: (res.ms / 1000).toFixed(2) }))} ${esc(loc(cards._meta.app_warning))}</p>`;
  box.innerHTML = html;
  $('#photo-slot').replaceWith(ph.el);
  requestAnimationFrame(() => requestAnimationFrame(() => box.querySelectorAll('.meter-fill').forEach(f => { f.style.width = f.dataset.w + '%'; })));
}

function resetCheck() {
  stopSpeaking();
  lastCheck = null;
  $('#check-result').hidden = true; $('#check-result').innerHTML = '';
  $('#check-start').hidden = false;
  $('#in-camera').value = ''; $('#in-gallery').value = '';
  toTop();
}

// ---------- read aloud ----------
const VOICE_LANG = { en: ['en-IN', 'en'], hi: ['hi-IN', 'hi'], mr: ['mr-IN', 'mr', 'hi-IN', 'hi'] };
function pickVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  for (const want of VOICE_LANG[lang]) {
    const v = voices.find(x => x.lang.replace('_', '-').toLowerCase().startsWith(want.toLowerCase()));
    if (v) return v;
  }
  return null;
}
function canSpeak() { return !!pickVoice(); }
let speaking = false;
function speakResult() {
  if (speaking) { stopSpeaking(); return; }
  const { res } = lastCheck, top = meta.classes[res.order[0]], conf = res.probs[res.order[0]];
  let parts;
  if (conf >= TH()) {
    const c = cards[top];
    parts = [title(top), t('sure_pct', { p: pct(conf) }), t('urgency_' + c.urgency), t('sec_now'), ...loc(c.act_now)];
  } else {
    const u = cards._uncertain;
    parts = [loc(u.title), loc(u.message), t('better_photo'), ...loc(u.retake_tips)];
  }
  const v = pickVoice(), u = new SpeechSynthesisUtterance(parts.join('. '));
  u.voice = v; u.lang = v.lang; u.rate = 0.95;
  u.onend = u.onerror = () => { speaking = false; updateSpeakBtn(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u); speaking = true; updateSpeakBtn();
}
function stopSpeaking() { if ('speechSynthesis' in window) speechSynthesis.cancel(); speaking = false; updateSpeakBtn(); }
function updateSpeakBtn() { const b = document.querySelector('[data-act="speak"] span'); if (b) b.textContent = speaking ? t('stop') : t('listen'); }
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { if (lastCheck && !document.querySelector('[data-act="speak"]')) renderCheckResult(); };

// ---------- the game ----------
let G = { phase: 'intro' };
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

function newGame() {
  const byClass = {};
  for (const it of game.lab) (byClass[it.label] ||= []).push(it);
  const lab = shuffle(Object.keys(byClass)).slice(0, GAME.lab).map(c => ({ ...shuffle(byClass[c])[0], stage: 'lab' }));
  const fByClass = {};
  for (const it of game.field) (fByClass[it.label] ||= []).push(it);
  const field = shuffle(Object.keys(fByClass)).slice(0, GAME.field).map(c => ({ ...shuffle(fByClass[c])[0], stage: 'field' }));
  G = { phase: 'round', rounds: [...lab, ...field], i: 0, you: 0, ai: 0, log: [] };
  renderGame(); toTop();
}

function scoreCard(bump) {
  return `<div class="card score" aria-live="polite">
    <div class="side you"><span class="who">${esc(t('you'))}</span><span class="n"><span class="${bump === 'you' ? 'bump' : ''}">${G.you}</span></span></div>
    <span class="vs">${esc(t('you_vs_ai'))}</span>
    <div class="side ai"><span class="who">${esc(t('ai'))}</span><span class="n"><span class="${bump === 'ai' ? 'bump' : ''}">${G.ai}</span></span></div>
  </div>
  <div class="progress">${G.rounds.map((r, k) => `<i class="${r.stage} ${k < G.i || (k === G.i && G.phase === 'reveal') ? 'done' : ''} ${k === G.i && G.phase === 'round' ? 'now' : ''}"></i>`).join('')}</div>`;
}

function renderGame() {
  const v = $('#view-game');
  if (!cards || !game) return;
  if (G.phase === 'intro') {
    const best = store.get('best', null);
    v.innerHTML = `<div class="card hero">
        <div class="badge">${I.trophy}</div>
        <h1 class="t-large">${esc(t('game_title'))}</h1>
        <p class="lead">${esc(t('game_lead', { n: GAME.lab + GAME.field }))}</p>
        <button class="btn btn-primary" type="button" data-game="start">${esc(t('start_game'))}</button>
        ${best ? `<p class="small" style="margin:12px 0 0;text-align:center">${esc(t('best_score', best))}</p>` : ''}
      </div>
      <div class="group" style="margin-top:16px">
        <div class="intro-stage"><span class="n lab">1</span><div><div class="t-head">${esc(t('stage1_name'))}</div><div class="small">${esc(t('stage1_desc', { n: GAME.lab }))}</div></div></div>
        <div class="intro-stage"><span class="n field">2</span><div><div class="t-head">${esc(t('stage2_name'))}</div><div class="small">${esc(t('stage2_desc', { n: GAME.field }))}</div></div></div>
      </div>`;
    return;
  }
  if (G.phase === 'stage2') {
    v.innerHTML = `${scoreCard()}<div class="card hero" style="margin-top:16px">
      <div class="badge" style="background:var(--amber-soft);color:var(--amber)">${I.leaf}</div>
      <h2 class="t-large">${esc(t('stage2_intro_title'))}</h2><p class="lead">${esc(t('stage2_intro'))}</p>
      <button class="btn btn-primary" type="button" data-game="continue">${esc(t('continue'))}</button></div>`;
    return;
  }
  if (G.phase === 'results') { renderResults(v); return; }

  const r = G.rounds[G.i], labRounds = G.rounds.filter(x => x.stage === 'lab').length;
  const stageName = r.stage === 'lab' ? t('stage1_name') : t('stage2_name');
  const idx = r.stage === 'lab' ? G.i + 1 : G.i - labRounds + 1, n = r.stage === 'lab' ? labRounds : G.rounds.length - labRounds;
  const log = G.log[G.i];
  let body;
  if (!log) {
    body = `<h2 class="t-head" style="margin:16px 2px 10px">${esc(t('question'))}</h2>
      ${G.busy ? `<div class="thinking"><div class="spinner"></div>${esc(t('ai_thinking'))}</div>` : ''}
      <div class="options">${OPTION_ORDER.map(c => `<button type="button" class="opt ${G.busy && c === G.chosen ? 'chosen' : ''}" data-opt="${esc(c)}" ${G.busy ? 'disabled' : ''}>
        <span class="radio"></span><span class="txt"><b>${esc(title(c))}</b><small>${esc(loc(cards[c].hint))}</small></span></button>`).join('')}</div>`;
  } else {
    const last = G.i === G.rounds.length - 1, beforeStage2 = r.stage === 'lab' && G.rounds[G.i + 1] && G.rounds[G.i + 1].stage === 'field';
    G.nextPhase = last ? 'results' : beforeStage2 ? 'stage2' : 'round';
    body = `<div class="card reveal">
      <h2 class="t-title">${esc(t('it_was', { x: title(r.label) }))}</h2>
      <div class="verdict">${log.you === r.label ? I.ok : I.no}<span>${esc(t('you_said', { x: title(log.you) }))}</span></div>
      <div class="verdict">${log.ai === r.label ? I.ok : I.no}<span>${esc(t('ai_said', { x: title(log.ai), p: pct(log.conf) }))}${log.conf < TH() ? `<span class="note">${esc(t('ai_unsure_note'))}</span>` : ''}</span></div>
      <div class="tell"><b>${esc(t('how_to_tell'))}:</b> ${esc(loc(cards[r.label].signs)[0])}</div>
      <button class="btn btn-primary" type="button" data-game="next">${esc(last ? t('see_results') : t('next_leaf'))}</button>
    </div>`;
  }
  v.innerHTML = `${scoreCard(G.bump)}
    <div class="stage-row"><span class="t-head">${esc(stageName)}</span><span class="small num">${esc(t('round_of', { i: idx, n }))}</span></div>
    <div id="g-photo"></div>${body}`;
  G.bump = null;
  const forRound = G.i;
  loadImage(photo(r.file)).then(img => {
    if (forRound !== G.i || !$('#g-photo')) return;
    const ph = makePhoto(img, 32, { toggle: !!log, heatOn: !!G.heat }); G.ph = ph;
    if (log) ph.setCam(log.cam);
    $('#g-photo').replaceWith(ph.el);
  });
}

async function answer(choice) {
  if (G.busy || G.log[G.i]) return;
  G.busy = true; G.chosen = choice; renderGame();
  const r = G.rounds[G.i];
  try { await modelReady; } catch (e) { G.busy = false; return; }
  const img = await loadImage(photo(r.file));
  const [res] = await Promise.all([diagnose(prepare(img)), sleep(650)]);
  const ai = meta.classes[res.order[0]], conf = res.probs[res.order[0]];
  const youRight = choice === r.label, aiRight = ai === r.label;
  if (youRight) G.you++;
  if (aiRight) G.ai++;
  G.bump = youRight && aiRight ? null : youRight ? 'you' : aiRight ? 'ai' : null;
  G.log[G.i] = { you: choice, ai, conf, cam: camFor(res.features, res.order[0]), stage: r.stage, label: r.label };
  G.busy = false; G.phase = 'reveal'; G.heat = false;
  if (navigator.vibrate) navigator.vibrate(youRight ? 25 : [20, 60, 20]);
  renderGame();
  toTop(true);
}

function renderResults(v) {
  const L = G.log, lab = L.filter(x => x.stage === 'lab'), field = L.filter(x => x.stage === 'field');
  const cnt = (a, who) => a.filter(x => x[who] === x.label).length;
  const sureWrong = L.filter(x => x.ai !== x.label && x.conf >= TH()).length;
  const anyWrong = L.some(x => x.ai !== x.label);
  const verdict = G.you > G.ai ? t('result_you_win') : G.you < G.ai ? t('result_ai_wins') : t('result_draw');
  const s = meta.stats, th = pct(TH());
  v.innerHTML = `<div class="card final">
      <div class="t-title">${esc(verdict)}</div>
      <div class="big"><span class="y">${G.you}</span><span class="sep">:</span><span class="a">${G.ai}</span></div>
      <div class="who-row"><span>${esc(t('you'))}</span><span>${esc(t('ai'))}</span></div>
    </div>
    <div class="group" style="margin-top:16px">
      <div class="row"><span class="grow small" style="font-weight:600"></span><span class="small" style="width:64px;text-align:right;font-weight:600">${esc(t('you'))}</span><span class="small" style="width:64px;text-align:right;font-weight:600">${esc(t('ai'))}</span></div>
      <div class="row"><span class="grow">${esc(t('stage1_name'))}</span><span class="num" style="width:64px;text-align:right">${cnt(lab, 'you')} / ${lab.length}</span><span class="num" style="width:64px;text-align:right">${cnt(lab, 'ai')} / ${lab.length}</span></div>
      <div class="row"><span class="grow">${esc(t('stage2_name'))}</span><span class="num" style="width:64px;text-align:right">${cnt(field, 'you')} / ${field.length}</span><span class="num" style="width:64px;text-align:right">${cnt(field, 'ai')} / ${field.length}</span></div>
    </div>
    <h2 class="label">${esc(t('what_this_shows'))}</h2>
    <div class="card"><ul class="lessons">
      <li>${esc(t('lesson_lab', { ai: cnt(lab, 'ai'), n: lab.length, acc: pct(s.test_accuracy) }))}</li>
      <li>${esc(t('lesson_field', { ai: cnt(field, 'ai'), n: field.length, acc: pct(s.plantdoc_accuracy) }))}</li>
      ${anyWrong ? `<li>${esc(sureWrong ? t('lesson_sure', { k: sureWrong, t: th }) : t('lesson_sure_none', { t: th }))}</li>` : ''}
    </ul></div>
    <div style="margin-top:16px"><button class="btn btn-primary" type="button" data-game="start">${esc(t('play_again'))}</button></div>`;
}

function nextRound() {
  if (G.nextPhase === 'results') {
    G.phase = 'results';
    const best = store.get('best', null);
    if (!best || G.you > best.you || (G.you === best.you && G.ai < best.ai)) store.set('best', { you: G.you, ai: G.ai });
  } else if (G.nextPhase === 'stage2') { G.i++; G.phase = 'stage2'; }
  else { G.i++; G.phase = 'round'; }
  renderGame(); toTop();
}

// ---------- link and QR ----------
function qrSvg(text) {
  try {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }).replace('<svg ', '<svg role="img" aria-label="QR code" ');
  } catch (e) { return ''; }
}
function renderDesk() {
  const box = $('#desk-qr');
  if (box && !box.dataset.done) { box.innerHTML = qrSvg(appUrl()); box.dataset.done = '1'; }
  const link = $('#desk-link'); if (link) link.textContent = appUrl();
}

// ---------- about ----------
function renderAbout() {
  const v = $('#view-about');
  if (!cards) return;
  const s = meta ? meta.stats : null, th = pct(TH());
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const mb = meta ? (meta.model_bytes / 1e6).toFixed(1) + ' MB' : '…';
  const backend = backendName ? (backendName === 'wasm' ? 'WebAssembly (CPU)' : backendName === 'webgl' ? 'WebGL (GPU)' : 'CPU') : '…';
  const speed = speedMs ? t('speed_result', { ms: Math.round(speedMs) }).replace(/ \(.*\)$/, '').replace(/ \(.*\)।?$/, '') : t('not_measured');
  v.innerHTML = `<h1 class="t-large">${esc(t('about_title'))}</h1><p class="muted">${esc(t('about_lead'))}</p>
    <div class="chips" style="margin:12px 0 0" data-status>${statusChips()}</div>
    <ol class="group steps" style="margin-top:16px">${['step1', 'step2', 'step3', 'step4', 'step5', 'step6'].map((k, i) => `<li><span class="n">${i + 1}</span><span>${esc(t(k, { t: th }))}</span></li>`).join('')}</ol>
    <h2 class="label">${esc(t('how_well'))}</h2>
    ${s ? `<div class="group">
      <div class="row metric"><span class="grow">${esc(t('m_lab'))}</span><span class="val">${esc(t('m_lab_v', { acc: (s.test_accuracy * 100).toFixed(1), f1: s.test_macro_f1.toFixed(2) }))}</span></div>
      <div class="row metric"><span class="grow">${esc(t('m_gate', { t: th }))}</span><span class="val">${esc(t('m_gate_v', { share: pct(s.threshold_answered_share), acc: pct(s.threshold_accuracy_on_answered) }))}</span></div>
      <div class="row metric"><span class="grow">${esc(t('m_field'))}</span><span class="val">${esc(t('m_field_v', { f1: s.field_cv_macro_f1.toFixed(2) }))}</span></div>
      <div class="row metric"><span class="grow">${esc(t('m_pd'))}</span><span class="val bad">${esc(t('m_pd_v', { acc: (s.plantdoc_accuracy * 100).toFixed(1) }))}</span></div>
    </div>` : `<div class="busy"><div class="spinner"></div></div>`}
    <h2 class="label">${esc(t('on_phone'))}</h2>
    <div class="group">
      <div class="row"><span class="grow">${esc(t('p_size'))}</span><span class="val">${mb}</span></div>
      <div class="row"><span class="grow">${esc(t('p_backend'))}</span><span class="val">${esc(backend)}</span></div>
      <div class="row"><span class="grow">${esc(t('p_speed'))}</span><span class="val" id="speed-cell">${esc(speed)}</span></div>
      <div class="row"><span class="grow">${esc(t('p_offline'))}</span><span class="val">${esc(offlineReady ? t('yes') : t('not_yet'))}</span></div>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-tonal" type="button" data-act="speed" ${modelState !== 'ready' ? 'disabled' : ''}>${esc(t('run_speed'))}</button>
      ${standalone ? `<button class="btn btn-secondary" type="button" disabled>${esc(t('installed'))}</button>`
        : installPrompt ? `<button class="btn btn-primary" type="button" data-act="install">${esc(t('install'))}</button>` : ''}
    </div>
    ${!standalone && !installPrompt && ios ? `<p class="small" style="margin:10px 4px 0">${esc(t('install_ios'))}</p>` : ''}
    <h2 class="label">${esc(t('share_title'))}</h2>
    <div class="card qr-card">
      <div class="qr">${qrSvg(appUrl())}</div>
      <div style="min-width:0"><p class="small" style="color:var(--ink)">${esc(t('share_body'))}</p>
        <div class="qr-link">${esc(appUrl())}</div>
        <button class="btn btn-secondary" type="button" data-act="share" style="min-height:42px;padding:8px 12px">${I.share}<span>${esc(navigator.share ? t('share_link') : t('copy_link'))}</span></button>
      </div>
    </div>
    <h2 class="label">${esc(t('data_title'))}</h2>
    <div class="card"><p style="margin:0 0 12px">${esc(t('data_body'))}</p><div class="warn-box" style="margin:0">${esc(t('disclaimer'))}</div></div>
    <p class="foot">${esc(t('credit'))}${lang !== 'en' ? ' ' + esc(t('lang_note')) : ''}</p>`;
  if (modelState === 'ready' && !speedMs && !runSpeedTest.running) setTimeout(() => runSpeedTest(null, 5), 400);
}

async function runSpeedTest(btn, n = 10) {
  if (runSpeedTest.running) return;
  runSpeedTest.running = true;
  if (btn) btn.disabled = true;
  const cell = $('#speed-cell'); if (cell) cell.textContent = t('speed_running');
  try {
    await modelReady;
    const img = await loadImage(photo(game.samples[0].file));
    speedMs = await benchmark(prepare(img), n); speedRuns = n;
  } finally { runSpeedTest.running = false; }
  if (currentView === 'about') renderAbout();
}

async function shareLink() {
  const url = appUrl();
  if (navigator.share) { try { await navigator.share({ title: t('app_name'), url }); } catch (e) { /* closed */ } return; }
  try { await navigator.clipboard.writeText(url); toast(t('link_copied')); } catch (e) { toast(url); }
}

// ---------- offline + install ----------
async function checkOffline() {
  if (!('caches' in window)) return;
  try {
    const hit = await caches.match('model/group1-shard1of1.bin', { ignoreSearch: true });
    offlineReady = !!hit && !!navigator.serviceWorker.controller;
  } catch (e) { offlineReady = false; }
  renderStatus(); if (currentView === 'about') renderAbout();
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(checkOffline).catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'cached') checkOffline(); });
    navigator.serviceWorker.addEventListener('controllerchange', checkOffline);
  });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (currentView === 'about') renderAbout(); });
window.addEventListener('appinstalled', () => { installPrompt = null; if (currentView === 'about') renderAbout(); });

// ---------- events ----------
document.addEventListener('click', async e => {
  const el = e.target.closest('button');
  if (!el) return;
  if (el.dataset.lang) setLang(el.dataset.lang);
  else if (el.dataset.view) { if (location.hash.slice(1) === el.dataset.view) toTop(true); else location.hash = el.dataset.view; }
  else if (el.dataset.sample !== undefined) { checkPhoto(photo(game.samples[+el.dataset.sample].file)); }
  else if (el.dataset.heat !== undefined) {
    const on = el.dataset.heat === '1';
    if (lastCheck && lastCheck.photo && lastCheck.photo.el.contains(el)) {
      lastCheck.showHeat = on; lastCheck.photo.showHeat(on);
      const note = document.querySelector('.heat-note'); if (note) note.hidden = !on;
    } else if (G.ph && G.ph.el.contains(el)) { G.heat = on; G.ph.showHeat(on); }
  }
  else if (el.dataset.act === 'again') resetCheck();
  else if (el.dataset.act === 'speak') speakResult();
  else if (el.dataset.act === 'speed') runSpeedTest(el, 10);
  else if (el.dataset.act === 'share') shareLink();
  else if (el.dataset.act === 'install' && installPrompt) { installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; renderAbout(); }
  else if (el.dataset.opt) answer(el.dataset.opt);
  else if (el.dataset.game === 'start') newGame();
  else if (el.dataset.game === 'continue') { G.phase = 'round'; renderGame(); toTop(); }
  else if (el.dataset.game === 'next') nextRound();
});
for (const id of ['#in-camera', '#in-gallery']) {
  $(id).addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (f) checkPhoto(URL.createObjectURL(f));
  });
}
window.addEventListener('hashchange', () => showView(location.hash.slice(1)));

// For testing from the browser console.
window.leafDebug = { modelReady, prepare, diagnose, loadImage, camFor, photo };

// ---------- start ----------
(async function init() {
  document.documentElement.lang = lang;
  renderLangButtons(); applyStatic(); renderDesk();
  const [c, g, ph] = await Promise.all(['data/cards.json', 'data/game.json', 'data/photos.json'].map(u => fetch(u).then(r => r.json())));
  cards = c; game = g; PHOTOS = ph;
  renderHome(); renderGame();
  showView(location.hash.slice(1));
})();
</script>
</body>
